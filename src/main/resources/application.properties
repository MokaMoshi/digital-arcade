spring.application.name=digital-arcade

spring.datasource.url=jdbc:mysql://localhost:3306/digital_arcade_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

usuarios.api.url=http://localhost:8080/api/usuarios/existe/
usuarios.api.timeout-segundos=5
